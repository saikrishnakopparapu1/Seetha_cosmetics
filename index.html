<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineMax · Movie Booking</title>
  <!-- Google Fonts + Font Awesome for icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* modern reset + base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0b0f1a;
      color: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.5;
    }

    /* main card – world class developer aesthetic */
    .booking-app {
      max-width: 1100px;
      width: 100%;
      background: rgba(18, 24, 38, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2.2rem 2.5rem;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.8), 
                  inset 0 1px 2px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
    }

    /* header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .logo i {
      color: #f43f5e;
      filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.5));
      font-size: 2rem;
    }

    .logo span {
      background: linear-gradient(to right, #fff, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .badge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge i {
      color: #facc15;
      font-size: 0.9rem;
    }

    /* movie list – elegant cards */
    .movie-section {
      margin-bottom: 2rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-title i {
      color: #f43f5e;
      font-size: 1rem;
    }

    .movie-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .movie-card {
      background: #1e2438;
      border-radius: 1.5rem;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      flex: 1 1 200px;
      box-shadow: 0 8px 16px -8px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .movie-card:hover {
      background: #252d44;
      transform: translateY(-2px);
      border-color: rgba(244, 63, 94, 0.4);
    }

    .movie-card.active {
      border-color: #f43f5e;
      background: #2a2f4a;
      box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.3), 0 12px 24px -12px #f43f5e;
    }

    .movie-poster {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: linear-gradient(145deg, #2d344b, #1b1f30);
      color: #facc15;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }

    .movie-info h3 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.2rem;
    }

    .movie-info p {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* showtimes row */
    .showtime-section {
      margin-bottom: 2rem;
    }

    .showtime-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .time-chip {
      background: #1e2438;
      border: 1.5px solid #2a3149;
      border-radius: 60px;
      padding: 0.7rem 1.6rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      user-select: none;
    }

    .time-chip i {
      color: #facc15;
      font-size: 0.9rem;
    }

    .time-chip:hover {
      background: #252d44;
      border-color: #4f5b7a;
      color: #fff;
    }

    .time-chip.active {
      background: #f43f5e;
      border-color: #f43f5e;
      color: white;
      box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.3), 0 8px 16px -8px #f43f5e;
    }

    .time-chip.active i {
      color: white;
    }

    /* seat map area */
    .seat-section {
      background: #141a28;
      border-radius: 2rem;
      padding: 1.8rem 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid #242b3f;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6);
    }

    .screen-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .screen-curve {
      width: 80%;
      max-width: 500px;
      height: 38px;
      background: linear-gradient(to bottom, #3b4259, #1b2132);
      border-radius: 0 0 120px 120px;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.8), inset 0 -4px 8px rgba(255, 255, 255, 0.05);
      border-bottom: 3px solid #f43f5e;
      margin-bottom: 0.5rem;
    }

    .screen-label {
      color: #6b7a99;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .seats-grid {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      align-items: center;
      margin-bottom: 1.8rem;
    }

    .seat-row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .seat {
      width: 42px;
      height: 42px;
      background: #252e44;
      border-radius: 14px 14px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #7c8aa5;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 4px 0 #0d1220, 0 6px 8px rgba(0, 0, 0, 0.4);
      border: 1px solid #33405c;
      user-select: none;
      position: relative;
    }

    .seat:hover:not(.occupied) {
      background: #2f3b57;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0d1220, 0 10px 12px rgba(0, 0, 0, 0.4);
      color: #d9e2ff;
    }

    .seat.selected {
      background: #f43f5e;
      color: white;
      border-color: #ff8a9f;
      box-shadow: 0 4px 0 #a01a34, 0 8px 12px rgba(244, 63, 94, 0.4);
      transform: translateY(-1px);
    }

    .seat.occupied {
      background: #2d3243;
      color: #3e4559;
      cursor: not-allowed;
      box-shadow: 0 2px 0 #0b0f1a;
      border-color: #262c3e;
      opacity: 0.7;
    }

    .seat.occupied::after {
      content: "✕";
      font-size: 1rem;
      font-weight: 400;
      color: #4d556e;
    }

    .seat.occupied span {
      display: none;
    }

    /* legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 0.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-box {
      width: 20px;
      height: 20px;
      border-radius: 6px 6px 4px 4px;
      background: #252e44;
      border: 1px solid #33405c;
    }

    .legend-box.selected {
      background: #f43f5e;
      border-color: #ff8a9f;
    }

    .legend-box.occupied {
      background: #2d3243;
      border-color: #262c3e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #4d556e;
    }

    /* summary + CTA */
    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      background: #101624;
      border-radius: 2rem;
      padding: 1rem 1.8rem;
      border: 1px solid #242b3f;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .selected-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.5rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      background: #1b2132;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 1px solid #2d344b;
    }

    .info-item i {
      color: #facc15;
      font-size: 0.9rem;
    }

    .info-item strong {
      color: white;
      font-weight: 600;
    }

    .total-price {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(to right, #ffffff, #d9e2ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }

    .total-price span {
      font-size: 1.2rem;
      color: #f43f5e;
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
      margin-right: 0.2rem;
    }

    .book-btn {
      background: #f43f5e;
      border: none;
      border-radius: 60px;
      padding: 1rem 2.8rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px -8px #f43f5e, 0 4px 0 #a01a34;
      font-family: inherit;
      letter-spacing: -0.01em;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .book-btn:hover {
      background: #f55a74;
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -8px #f43f5e, 0 6px 0 #a01a34;
    }

    .book-btn:active {
      transform: translateY(2px);
      box-shadow: 0 6px 12px -6px #f43f5e, 0 2px 0 #a01a34;
    }

    .book-btn i {
      font-size: 1.2rem;
    }

    /* toast message */
    .toast-message {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-weight: 500;
      box-shadow: 0 20px 30px -10px black;
      border-left: 5px solid #f43f5e;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 999;
      font-size: 1rem;
    }

    .toast-message.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-message i {
      margin-right: 0.7rem;
      color: #facc15;
    }

    /* responsive touches */
    @media (max-width: 700px) {
      .booking-app {
        padding: 1.5rem;
      }
      .seat {
        width: 34px;
        height: 34px;
        font-size: 0.65rem;
        border-radius: 10px 10px 6px 6px;
      }
      .seat-row {
        gap: 0.5rem;
      }
      .summary-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .book-btn {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .seat {
        width: 28px;
        height: 28px;
        font-size: 0.55rem;
      }
      .seat-row {
        gap: 0.35rem;
      }
      .movie-card {
        padding: 0.8rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="booking-app">
    <!-- header -->
    <div class="app-header">
      <div class="logo">
        <i class="fas fa-film"></i>
        <span>CineMax</span>
      </div>
      <div class="badge">
        <i class="fas fa-star"></i> 4.9 · Premium experience
      </div>
    </div>

    <!-- movie selection -->
    <div class="movie-section">
      <div class="section-title">
        <i class="fas fa-video"></i> Now showing
      </div>
      <div class="movie-grid" id="movieGrid">
        <!-- Movie cards injected via JS -->
      </div>
    </div>

    <!-- showtime selection -->
    <div class="showtime-section">
      <div class="section-title">
        <i class="fas fa-clock"></i> Select showtime
      </div>
      <div class="showtime-grid" id="showtimeGrid">
        <!-- Time chips injected via JS -->
      </div>
    </div>

    <!-- seat map -->
    <div class="seat-section">
      <div class="screen-indicator">
        <div class="screen-curve"></div>
        <div class="screen-label">screen</div>
      </div>

      <div class="seats-grid" id="seatsGrid">
        <!-- Seat rows injected via JS -->
      </div>

      <!-- legend -->
      <div class="legend">
        <div class="legend-item"><div class="legend-box"></div> Available</div>
        <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
        <div class="legend-item"><div class="legend-box occupied">✕</div> Occupied</div>
      </div>
    </div>

    <!-- summary & book button -->
    <div class="summary-bar">
      <div class="selected-info">
        <div class="info-item">
          <i class="fas fa-chair"></i> <span id="seatCount">0</span> seats
        </div>
        <div class="info-item">
          <i class="fas fa-tag"></i> <strong id="selectedMovieName">—</strong>
        </div>
        <div class="info-item">
          <i class="fas fa-clock"></i> <span id="selectedTime">—</span>
        </div>
      </div>
      <div class="total-price">
        <span>$</span><span id="totalPrice">0</span>
      </div>
      <button class="book-btn" id="bookBtn">
        <i class="fas fa-ticket-alt"></i> Book now
      </button>
    </div>
  </div>

  <!-- toast for feedback -->
  <div class="toast-message" id="toast">
    <i class="fas fa-check-circle"></i> <span id="toastText">Booking confirmed!</span>
  </div>

  <script>
    (function() {
      // ---------- DATA ----------
      const movies = [
        { id: 'm1', title: 'Dune: Part Two', emoji: '🏜️', rating: 'PG-13', duration: '2h 46m' },
        { id: 'm2', title: 'Oppenheimer', emoji: '⚛️', rating: 'R', duration: '3h 0m' },
        { id: 'm3', title: 'Barbie', emoji: '💖', rating: 'PG-13', duration: '1h 54m' },
        { id: 'm4', title: 'The Batman', emoji: '🦇', rating: 'PG-13', duration: '2h 56m' }
      ];

      const showtimes = ['12:30 PM', '3:45 PM', '7:15 PM', '10:00 PM'];

      // seat layout: 6 rows, 8 seats per row (A1..A8 etc)
      const ROWS = ['A', 'B', 'C', 'D', 'E', 'F'];
      const SEATS_PER_ROW = 8;

      // Occupied seats (hardcoded for realism)
      const OCCUPIED_SEATS = new Set([
        'A3','A4','B5','B6','C2','C7','D1','D8','E4','E5','F2','F6'
      ]);

      // ---------- STATE ----------
      let selectedMovieId = movies[0].id;
      let selectedTime = showtimes[0];
      let selectedSeats = new Set(); // stores seat identifiers like 'A1', 'B2'

      // DOM elements
      const movieGrid = document.getElementById('movieGrid');
      const showtimeGrid = document.getElementById('showtimeGrid');
      const seatsGrid = document.getElementById('seatsGrid');
      const seatCountSpan = document.getElementById('seatCount');
      const selectedMovieNameSpan = document.getElementById('selectedMovieName');
      const selectedTimeSpan = document.getElementById('selectedTime');
      const totalPriceSpan = document.getElementById('totalPrice');
      const bookBtn = document.getElementById('bookBtn');
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');

      // ---------- HELPER FUNCTIONS ----------
      function getMovieById(id) {
        return movies.find(m => m.id === id);
      }

      // Update summary (movie name, time, seat count, total)
      function updateSummary() {
        const movie = getMovieById(selectedMovieId);
        selectedMovieNameSpan.textContent = movie ? movie.title : '—';
        selectedTimeSpan.textContent = selectedTime || '—';
        seatCountSpan.textContent = selectedSeats.size;

        // price: $12 per seat (base) + small movie premium (just for fun)
        const basePrice = 12;
        const moviePremium = selectedMovieId === 'm2' ? 2 : 0; // Oppenheimer costs $2 more
        const pricePerSeat = basePrice + moviePremium;
        const total = selectedSeats.size * pricePerSeat;
        totalPriceSpan.textContent = total.toFixed(0);
      }

      // Show toast message
      function showToast(msg, isSuccess = true) {
        toastText.textContent = msg;
        toast.querySelector('i').className = isSuccess ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
        toast.style.borderLeftColor = isSuccess ? '#f43f5e' : '#facc15';
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 2800);
      }

      // ---------- RENDER MOVIES ----------
      function renderMovies() {
        movieGrid.innerHTML = '';
        movies.forEach(movie => {
          const card = document.createElement('div');
          card.className = `movie-card ${movie.id === selectedMovieId ? 'active' : ''}`;
          card.dataset.movieId = movie.id;

          card.innerHTML = `
            <div class="movie-poster">${movie.emoji}</div>
            <div class="movie-info">
              <h3>${movie.title}</h3>
              <p><i class="fas fa-star" style="color:#facc15;"></i> ${movie.rating} · ${movie.duration}</p>
            </div>
          `;

          card.addEventListener('click', () => {
            if (selectedMovieId === movie.id) return;
            selectedMovieId = movie.id;
            // Reset selected seats when movie changes (to keep it clean)
            selectedSeats.clear();
            // Re-render movie active state
            renderMovies();
            updateSummary();
            // Re-render seats (occupied stays same but we may want to keep the state)
            renderSeats();
          });

          movieGrid.appendChild(card);
        });
      }

      // ---------- RENDER SHOWTIMES ----------
      function renderShowtimes() {
        showtimeGrid.innerHTML = '';
        showtimes.forEach(time => {
          const chip = document.createElement('div');
          chip.className = `time-chip ${time === selectedTime ? 'active' : ''}`;
          chip.innerHTML = `<i class="far fa-clock"></i> ${time}`;

          chip.addEventListener('click', () => {
            if (selectedTime === time) return;
            selectedTime = time;
            // Clear selected seats when showtime changes? Yes, for a realistic flow
            selectedSeats.clear();
            renderShowtimes();
            updateSummary();
            renderSeats(); // refresh seat highlighting
          });

          showtimeGrid.appendChild(chip);
        });
      }

      // ---------- RENDER SEATS ----------
      function renderSeats() {
        seatsGrid.innerHTML = '';

        ROWS.forEach(rowLetter => {
          const rowDiv = document.createElement('div');
          rowDiv.className = 'seat-row';

          for (let i = 1; i <= SEATS_PER_ROW; i++) {
            const seatId = `${rowLetter}${i}`;
            const seatDiv = document.createElement('div');
            seatDiv.className = 'seat';
            seatDiv.dataset.seatId = seatId;

            // Check if occupied
            if (OCCUPIED_SEATS.has(seatId)) {
              seatDiv.classList.add('occupied');
            } else if (selectedSeats.has(seatId)) {
              seatDiv.classList.add('selected');
            }

            // Display seat label (letter+number) — small text
            seatDiv.textContent = seatId;

            // Click handler (only if not occupied)
            if (!OCCUPIED_SEATS.has(seatId)) {
              seatDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedSeats.has(seatId)) {
                  selectedSeats.delete(seatId);
                  seatDiv.classList.remove('selected');
                } else {
                  // Optional: limit max seats (e.g., 8)
                  if (selectedSeats.size >= 8) {
                    showToast('Maximum 8 seats per booking', false);
                    return;
                  }
                  selectedSeats.add(seatId);
                  seatDiv.classList.add('selected');
                }
                updateSummary();
              });
            }

            rowDiv.appendChild(seatDiv);
          }

          seatsGrid.appendChild(rowDiv);
        });

        // After re-render, update summary (seat count may have changed if we cleared)
        updateSummary();
      }

      // ---------- BOOK ACTION ----------
      function handleBooking() {
        if (selectedSeats.size === 0) {
          showToast('Please select at least one seat', false);
          return;
        }

        const movie = getMovieById(selectedMovieId);
        const seatList = Array.from(selectedSeats).sort().join(', ');
        const total = totalPriceSpan.textContent;

        // Simulate booking success
        showToast(`✅ Booked ${selectedSeats.size} seat(s) for "${movie.title}" (${selectedTime}) · Total $${total}`);

        // Clear selected seats after booking? We could, but for UX let's keep them so user sees what they booked.
        // But we can also reset the selection to simulate a fresh start. Let's keep the seats selected for realism.
        // Optional: alert or just toast. We'll also disable the button briefly to prevent double booking.
        bookBtn.disabled = true;
        bookBtn.style.opacity = '0.7';
        setTimeout(() => {
          bookBtn.disabled = false;
          bookBtn.style.opacity = '1';
        }, 1500);
      }

      // ---------- INITIAL RENDER ----------
      function init() {
        renderMovies();
        renderShowtimes();
        renderSeats();   // also calls updateSummary inside
        // Ensure summary reflects initial state
        updateSummary();

        // Set up book button listener
        bookBtn.addEventListener('click', handleBooking);

        // Add some extra polish: set movie name in summary initially
        const firstMovie = getMovieById(selectedMovieId);
        if (firstMovie) {
          selectedMovieNameSpan.textContent = firstMovie.title;
        }

        // Add a small animation to the seat section (optional)
        // You can also pre-select a seat for demo? No, let the user do it.
      }

      init();
    })();
  </script>
